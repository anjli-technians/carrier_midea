<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Modal</title>
  <!-- Bootstrap 5 CSS -->
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Full screen dark background */
    body {
      background-color: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    /* Main Container Card */
    .login-card {
      width: 100%;
      max-width: 500px;
      padding: 3rem 2rem;
      border-radius: 1rem;
      position: relative;
    }

    /* Red Close Button */
    .btn-close-custom {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      width: 28px;
      height: 28px;
      background-color: #f44336;
      color: white;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
    }

    /* Typography */
    .title-text {
      color: #2A5FB0;
      font-weight: 700;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .sub-text {
      color: #555;
      font-size: 16px;
      margin-bottom: 10px;
    }

    /* Input Field Styling */
    .custom-input-group {
      border: 1px solid #ced4da;
      border-radius: 0.375rem;
      overflow: hidden;
      width: 50%;
      margin: auto;
    }
    
    .custom-input-group .input-group-text {
      background-color: transparent;
      border: none;
      border-right: 1px solid #ced4da;
      border-radius: 0;
      color: #333;
    }

    .custom-input-group .form-control {
      border: none;
      box-shadow: none !important; /* Removes blue glow on focus */
    }

    /* "OR" Divider */
    .divider-container {
      display: flex;
      align-items: center;
      text-align: center;
      margin: auto;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      width: 30%;
    }
    .social-btn i{font-size: 25px;}

    .divider-container::before,
    .divider-container::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #000;
    }

    .divider-container::before {
      margin-right: 1em;
    }

    .divider-container::after {
      margin-left: 1em;
    }

    /* Social Icons */
    .social-icons-wrapper {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .social-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background-color: #e9ecef;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #333;
      font-size: 1.2rem;
      transition: background-color 0.2s ease;
    }

    .social-btn:hover {
      background-color: #dee2e6;
      color: #333;
    }
    
    .google-icon {
      /* Standard Google colors for FontAwesome fallback */
      background: conic-gradient(from -45deg, #ea4335 110deg, #4285f4 90deg 180deg, #34a853 180deg 270deg, #fbbc05 270deg) 73% 55%/150% 150% no-repeat;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    /* Checkbox & Terms */
    .checkbox-text {
      font-size: 11px;
      color: #333;
    }

    .form-control{font-size: 14px !important; padding: 7px 5px !important;}
    .terms-text {
      font-size: 11px;
      color: #777;
      margin-top: 1rem;
      line-height: 1.4;
    }

    @media (max-width:767px){
        .login-card{max-width: 250px;
    padding: 1rem 1rem;
    border-radius: 1rem;}
    .title-text{font-size: 12px;}
    .sub-text{font-size: 10px;}
    .btn-close-custom{top: 10px; right: 10px;}
    .custom-input-group{width: 70%;}
    .input-group-text {font-size: 12px !important;}
    .custom-input-group .form-control{font-size: 12px !important;}
    .divider-container{width: 50%; font-size: 13px;}
    .social-btn{width: 35px; height: 35px;}
    .social-btn i {font-size: 20px;}
    .checkbox-text {font-size: 10px;}
    .terms-text{font-size: 10px; margin-top: 0;}
    br{display: none;}
    }
  </style>
</head>
<body>

  <!-- Main White Card -->
  <div class="bg-white login-card text-center shadow-lg">
    
    <!-- Close Icon -->
    <button class="btn-close-custom" aria-label="Close">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <!-- Headings -->
    <h2 class="title-text">Let's Get Started</h2>
    <p class="sub-text">Enter Your Mobile Number</p>

    <!-- Phone Input -->
    <div class="input-group custom-input-group mb-4">
      <span class="input-group-text" id="country-code">+91</span>
      <input type="tel" class="form-control" aria-label="Phone number" aria-describedby="country-code">
    </div>

    <!-- OR Divider -->
    <div class="divider-container">OR</div>

    <!-- Social Login Icons -->
    <div class="social-icons-wrapper">
      <a href="#" class="social-btn" aria-label="Login with Google">
        <i class="fa-brands fa-google google-icon"></i>
      </a>
      <a href="#" class="social-btn" aria-label="Login with Apple">
        <i class="fa-brands fa-apple"></i>
      </a>
    </div>

    <!-- Checkbox -->
    <div class="form-check d-flex justify-content-center align-items-center gap-2 mb-3">
      <input class="form-check-input mt-0" type="checkbox" value="" id="updatesCheck" checked>
      <label class="form-check-label checkbox-text" for="updatesCheck">
        Notify Me For Any Updates & Offers
      </label>
    </div>

    <!-- Terms and Conditions Text -->
    <p class="terms-text">
      I accept that I have read & understood Carrier Midea's<br>Privacy Policy and T&Cs.
    </p>

  </div>

  <!-- Bootstrap JS (Optional, for interactive components if added later) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
